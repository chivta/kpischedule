<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Розклад пар КПІ ім. Ігоря Сікорського: яка пара зараз, що далі, розклад груп і викладачів." />
    <meta name="theme-color" content="#07080d" />
    <title>Розклад КПІ</title>
    <script>
      // Applies the saved theme before first paint. Key and values match themeStore in src/lib/storage.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('kpis:theme'))
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
