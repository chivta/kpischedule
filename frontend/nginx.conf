worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Read-only root filesystem: keep all scratch state under /tmp.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  sendfile on;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Access log skips /health and /metrics.
  map $request_uri $loggable {
    default          1;
    "/health"        0;
    "/metrics"       0;
  }
  access_log /dev/stdout combined if=$loggable;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      return 204;
    }

    location = /metrics {
      stub_status;
    }

    # Hashed build assets are immutable.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # The shell names the current hashed assets, so a browser must revalidate it on every load.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # SPA routes resolve to the shell.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
