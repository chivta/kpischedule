apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        # uid and gid of the nginx user in nginx-unprivileged.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # CD rewrites this tag on every green build, placeholder only exists before the first run.
          image: ghcr.io/chivta/kpischedule/frontend:5fdb6501d18b8edf2ffa15238ce325511831d6ee
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx keeps its pid file and temp paths here, the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            # The Konami code photo, kept out of git and the image. nginx serves it at /egg/.
            - name: easter-egg
              mountPath: /usr/share/nginx/egg
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: easter-egg
          secret:
            secretName: easter-egg
